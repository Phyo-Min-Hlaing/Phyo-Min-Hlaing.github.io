<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lessons</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <h1>Grid Lessons</h1>
    <div class="grid_one">
        <div style="background-color: azure;">1</div>
        <div style="background-color: rgb(250, 240, 255);">2</div>
        <div style="background-color: rgb(240, 255, 241);">3</div>
        <div style="background-color: rgb(243, 240, 255);">4</div>
        <div style="background-color: rgb(255, 255, 240);">5</div>
        <div style="background-color: rgb(255, 247, 240);">6</div>
        <div style="background-color: rgb(246, 240, 255);">7</div>
        <div style="background-color: rgb(255, 245, 240);">8</div>
        <div style="background-color: rgb(240, 246, 255);">9</div>
    </div>

    <h1>Grid Column Gap</h1>

    <div class="grid_two">
        <div style="background-color: azure;">1</div>
        <div style="background-color: rgb(250, 240, 255);">2</div>
        <div style="background-color: rgb(240, 255, 241);">3</div>
        <div style="background-color: rgb(243, 240, 255);">4</div>
        <div style="background-color: rgb(255, 255, 240);">5</div>
        <div style="background-color: rgb(255, 247, 240);">6</div>
        <div style="background-color: rgb(246, 240, 255);">7</div>
        <div style="background-color: rgb(255, 245, 240);">8</div>
        <div style="background-color: rgb(240, 246, 255);">9</div>
    </div>

    <h1>Grid Column Add</h1>

    <div class="grid_three">
        <div style="background-color: azure;" class="columnadd">1</div>
        <div style="background-color: rgb(250, 240, 255);">2</div>
        <div style="background-color: rgb(240, 255, 241);">3</div>
        <div style="background-color: rgb(243, 240, 255);">4</div>
        <div style="background-color: rgb(255, 255, 240);">5</div>
        <div style="background-color: rgb(255, 247, 240);">6</div>
        <div style="background-color: rgb(246, 240, 255);">7</div>
        <div style="background-color: rgb(255, 245, 240);">8</div>
        <div style="background-color: rgb(240, 246, 255);">9</div>
    </div>

    <h1>Grid Row Add</h1>

    <div class="grid_four">
        <div style="background-color: azure;" class="rowadd">1</div>
        <div style="background-color: rgb(250, 240, 255);">2</div>
        <div style="background-color: rgb(240, 255, 241);">3</div>
        <div style="background-color: rgb(243, 240, 255);">4</div>
        <div style="background-color: rgb(255, 255, 240);">5</div>
        <div style="background-color: rgb(255, 247, 240);">6</div>
        <div style="background-color: rgb(246, 240, 255);">7</div>
        <div style="background-color: rgb(255, 245, 240);">8</div>
        <div style="background-color: rgb(240, 246, 255);">9</div>
    </div>

</body>
</html>
