<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Lessons</title>
</head>
<body>
    <h1>Loop Lessons</h1>
    <script>
        //for looping
        // document.write("<h3>hello world</h3>");
        // for (initailize; comparison; update++) (ဘယ်ကနေစမှာလဲ ဘယ်အ‌ခြေအနေမှာလဲ တန်ဖိုးတခုခုနဲ့update လုပ်မယ်) {
        for (let num = 0; num < 5; num++){
            document.write(`<h3>hello world ${num} </h3>`);
        }

        let laptops = ['Dell', 'Lenovo', 'Acer', 'Asus', 'Macbook', 'Fujitsu', 'HP']

        // document.write(`I want to this ${laptops[3]}`);

        for (let i = 0; i < laptops.length; i++){
        document.write(`I want to this ${laptops[i]}.<br>`);
        }
        
        for (let h = 0; h < 5; h++){
            for (let i = 0; i <= h; i++){
            document.write(`*`);
        }
            document.write(`<br>`);
        }

        for (let h = 5; h > 0; h--){
            for (let i = 0; i < h; i++){
            document.write(`*`);
        }
            document.write(`<br>`);
        }

        // while looping
        // while(condition){
        //     // code

        //     // update
        // }

        let num = 300;
        while(num > 100){
            document.write(`Your number is ${num}<br>`);

            // update
            num -=5
        }

        // Do while
        // do {
        //     // code

        //     // update
        // } while (condition);

        let no = 10;
        do{
            document.write(`Your number is ${no}<br>`);

            // update
            no -= 2;
        }while(no > 5);

        
    </script>
</body>
</html>
