<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variable</h1>
    <script>
        // global variable (var) အမှားများလို့ ခုနောက်ပိုင်းသိပ်မသုံးတော့ပါဘူး
        var name = "Phyo Min Hlaing";
        console.log(name);
        var name = "Ko Phyo";
        console.log(name);

        // block scope variable (Let) နောက်ထပ် assign ချလို့ရပီး ကြေငြာလို့မရပါဘူး
        let fatherName = "U Zaw Min";
        console.log(fatherName);
        fatherName = "U Zaw";
        console.log(fatherName);

        // const variable (const) နောက်ထပ် assign ချလို့လဲမရ ကြေငြာလို့လဲမရပါဘူး
        const motherName = "Daw Khin Aye Hlaing" 
        console.log(motherName);
        motherName = "Daw Hlaing"
        console.log(motherName);
    </script>
</body>
</html>
