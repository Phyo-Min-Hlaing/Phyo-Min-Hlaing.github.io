<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Condition</title>
</head>
<body>
    <h1>Homework Condition</h1>
    <script>
        let number = prompt("Enter a number is even or odd?")

        if (number % 2 == 0){
            document.write("Your number is even")
        }else {
            document.write("Your number is odd")
        }
    </script>
</body>
</html>
