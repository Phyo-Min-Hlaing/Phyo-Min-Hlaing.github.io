<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Lessons</title>
</head>
<body>
    <h1>Operator Lessons</h1>
    <script>
        // assign operator ကို = လို့ခေါ်ပါတယ်
        let name = 'Phyo Min Hlaing';

        // addition operator ကို + လို့ခေါ်ပါတယ်
        let total = 3 + 1;
        console.log(total);

        let result = total + 24;
        console.log(result);

        let three = '2445' + 1;
        console.log(three);

        // let number = 7;
        // number = number + 3;
        // console.log(number)

        let number = 7;
        number += 3;
        console.log(number)

        let addNum = 3;
        console.log(addNum++);
        console.log(addNum);
        console.log(++addNum);

        // substraction operator ကို - လို့ခေါ်ပါတယ်
        let two = 3 - 1;
        console.log(two);

        let num1 = 70;
        num1 -= 50;
        console.log(num1);

        let num2 = 40;
        // console.log(num2)
        console.log(num2--)
        console.log(num2)
        console.log(--num2)

        // division operator ကို / လို့ခေါ်ပါတယ်
        let div1 = 423435234 / 32341;
        console.log(div1);
        console.log(div1.toFixed(2));
        console.log(div1.toFixed(0));

        let div2 = 10;
        div2 /= 2;
        console.log(div2)

        // remainder operator ကို % လို့ခေါ်ပါတယ် "စားကြွင်း"
        let rem1 = 50 % 3;
        console.log(rem1)

        let rem2 = 50;
        rem2 %= 3;
        console.log(rem2)

        // multiplication ကို * လို့ခေါ်ပါတယ်
        let mult = 2311231231 * 242;
        console.log(mult)

        // exponentation ကို ** လို့ခေါ်ပါတယ် "ထပ်ကိန်း"
        let exp = 12 ** 6;
        console.log(exp)

        let exp1 = 12;
        exp1 **= 6;
        console.log(exp1)

        // precendence ကွင်း၏ မြှောက်စားပေါင်းနုတ်
        let total1 = 2 * (2 + 5) / 2 % 2 -5;
        console.log(total1)
        // = 2 * 7 / 2 % 2 - 5
        // = 14 / 2 % 2- 5
        // = 7 % 2 - 5
        // = 1 - 5
        // = -4


    </script>
</body>
</html>
